baseURL = "https://733nwolf.is-a.dev/blog/"
locale = "en-US"
title = "Aswin Krishna ( 733n_wolf ) — Blog"
theme = "hugo-blog-awesome"

defaultContentLanguage = "en"

[params]
  sitename = "Aswin Krishna — Blog"
  description = "CTF writeups and pentesting blog"
  defaultColor = "dark"
  mainSections = ["posts"]
  toc = true
  tocOpen = false
  goToTop = true
  additionalScripts = ["js/pdf-viewer.js"]
  rssFeedDescription = "summary"

author = { name = "Aswin Krishna", email = "733nwolf@gmail.com", url = "https://733nwolf.is-a.dev" }

[markup]
  [markup.highlight]
    noClasses = false
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4

[menu]
  [[menu.main]]
    identifier = "home"
    name = "Home"
    url = "/blog/"
    weight = 10
  [[menu.main]]
    identifier = "posts"
    name = "Posts"
    url = "/blog/posts/"
    weight = 20
  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/blog/about/"
    weight = 30
